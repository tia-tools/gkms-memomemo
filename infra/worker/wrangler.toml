name = "gkms-memomemo"
main = "worker.ts"
compatibility_date = "2026-09-01"

# Custom domain (decision D24): Cloudflare creates and manages the DNS record when this deploys,
# since the tia.run zone is in the same account. One single-level subdomain per tia-tools app: the
# zone's free Universal SSL certificate covers no second level.
routes = [
  { pattern = "gkms-memomemo.tia.run", custom_domain = true }
]

# The built page (`bun run build` at the repository root writes dist/). Only the paths the Worker
# answers (worker.ts `route`) run its code first; everything else is served from the assets, which
# costs no Worker request on the Free plan (decision D42).
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/img/*", "/data/skillcards.json", "/count", "/counts"]

# The anonymous counts and the per-player daily cap (decision D41), tables in migrations/. The
# database was created in Milestone 7 (`bunx wrangler d1 create gkms-memomemo --location apac`,
# 2026-11-02). Without its `database_id`, `wrangler deploy` would provision a new database under
# this name instead of binding this one, so wrangler.test.ts requires the id. See README.md § Counts.
[[d1_databases]]
binding = "DB"
database_name = "gkms-memomemo"
database_id = "7e84c483-1b2d-40bf-b7c1-1f4572c1fe03"
migrations_dir = "migrations"

# Deletes the cap rows of past UTC days (count.ts `cleanCaps`), a few minutes after each day starts.
[triggers]
crons = ["5 0 * * *"]

# The sibling's image library (docs/adr/0001), read only: img.ts never writes, and no request path
# maps to anything but the sprite sheets and their index.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tia-assets"
